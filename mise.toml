[env]
_ = { file = [".env", "data/shared/backstage.json"] }

[tasks.sourcemap]
run = "rojo sourcemap dev.project.json --output sourcemap.json"

[tasks.blink]
run = "blink ./src/remotes/init.blink --yes"

[tasks.asphalt]
run = "asphalt sync"

[tasks.install]
run = "pesde install"

[tasks.build]
run = "mise run install && mise run sourcemap && mise run blink"

[tasks.format]
run = "stylua src data tests scripts playtests"

[tasks.analyze]
depends = ["sourcemap"]
shell = "bash -c"
run = """
[ -f roblox.d.luau ] || curl -L https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/refs/heads/main/scripts/globalTypes.d.luau -o roblox.d.luau
luau-lsp analyze \
	--sourcemap=sourcemap.json \
	--definitions=roblox.d.luau \
	--settings=.vscode/settings.json \
	--ignore="**/network/**" \
	--ignore="**/roblox_packages/**" \
	--ignore="**/roblox_server_packages/**" \
	--ignore="**/lune_packages/**" \
	--ignore="**/luau_packages/**" \
	--ignore="**/cloud_test.luau" \
	src data tests scripts playtests
"""

[tasks.rojo]
run = "rojo serve dev.project.json"

[tasks.backstage]
run = "backstage serve --port {{env.port}}"

[tasks.dev]
depends = ["build"]
run = [{ tasks = ["rojo", "backstage"] }]

[tasks.test]
depends = ["blink"]
shell = "bash -c"
run = """
if [ "{{flag(name='cloud')}}" = "true" ]; then
	sh scripts/cloud_test.sh
else
	sh scripts/repair_studio_path.sh
	rojo build test.project.json --output test-place.rbxl
	sh scripts/minimized.sh run-in-roblox --place test-place.rbxl --script scripts/run_tests.luau
fi
"""

[tasks.playtest]
shell = "bash -c"
run = """
if ! ls playtests/specs/*/server.luau >/dev/null 2>&1; then
	echo "no playtest specs yet"
	exit 0
fi

if [ -z "$ROBLOX_PLAYTEST_PLACE_ID" ]; then
	echo "ROBLOX_PLAYTEST_PLACE_ID is missing: set it in .env" >&2
	exit 1
fi

filter="{{option(name='filter', default='')}}"
filter=$(printf %s "$filter" | tr -d "'")
flags=""
if [ "{{flag(name='show')}}" = "true" ]; then flags="$flags --show"; fi
if [ "{{flag(name='verbose')}}" = "true" ]; then flags="$flags --verbose"; fi
if [ -n "$filter" ]; then flags="$flags --filter $filter"; fi
scrim --place "$ROBLOX_PLAYTEST_PLACE_ID" --project playtest.project.json --specs ./playtests/specs $flags
"""
